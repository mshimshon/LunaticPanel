# Post processing is design to allow mocking data or extra information to be moved to WSL in a fast flexible way
# You can build extra projects IE: Tools or plugin specific sub folders such as installers or optional feature underlaying softwares.a
# You can choose to build, publish csproject and archive it than move it to WSL... same for folders and files.
post_processing:
     - command: "wget https://dot.net/v1/dotnet-install.sh -O /tmp/dotnet-install.sh && chmod +x /tmp/dotnet-install.sh && /bin/bash /tmp/dotnet-install.sh --channel 10.0 --runtime aspnetcore --install-dir /usr/share/dotnet"
     - command: "[ -f /usr/bin/dotnet ] || ln -s /usr/share/dotnet/dotnet /usr/bin/dotnet"
#    - import_from: "../../Panel/src/lpcli-compose.yml"  will import all the post_processing from Panel Source firs
     - dotnet_project: "../tools/LunaticPanel.Package.Tool/LunaticPanel.Package.Tool.csproj"
       publish_to: "/opt/lpcli_tool"
