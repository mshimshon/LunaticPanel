apt:
  - "openssh-server"
  - "openssh-client"
  - "tmux"
  - "libicu-dev"
  - "socat"
  - "screen"
  - "curl"
services:
    - dotnet_project: "./LunaticPanel.Hybrid/LunaticPanel.Hybrid.Web/LunaticPanel.Hybrid.Web.csproj"
      service_name: "lunaticpanel"
      # https:// to the location of deb release file we want.
      # deb_url: ""
      exec_start: "./LunaticPanel.Hybrid.Web"
      working_dir: "/srv/lunaticpanel"
      description: "Lunatic Panel dashboard hosting."
      environment:
        - "ASPNETCORE_ENVIRONMENT=Development"
        - "LP_WAIT_FOR_DEBUGGER=true" # Force panel to await attached debugger
        - "DOTNET_ENABLE_DIAGNOSTICS=1" # Open up the core diagnostics server pipeline
        - "DOTNET_EnableDiagnostics_Debugger=1" # Explicitly keep debugger subsystem hook active
        - "DOTNET_EnableDiagnostics_IPC=1" # Unblock Linux named pipes/inter-process communication
        - "DOTNET_MODIFIABLE_ASSEMBLIES=debug" # Preserve dynamic assembly structure for injection
        - "DOTNET_JITMinOpts=1" # Kill JIT loop flattening and code inlining optimizations
        - "DOTNET_ZapDisable=1" # Prevent loading pre-compiled NGen framework images
        - "DOTNET_ReadyToRun=0" # Bypass cached ahead-of-time optimized binary layers
        - "DOTNET_TieredCompilation=0" # Stop background runtime code re-optimization sweeps
        - "DOTNET_TieredPGO=0" # Turn off aggressive Profile-Guided dynamic optimizations
        - "DOTNET_HotReload_Enabled=1" # Lock engine metadata tables into live-editable states
      show: true
      depends_on:
          - lpkg_localserver

    - dotnet_project: "../tools/LunaticPanel.Package.LocalServer/LunaticPanel.Package.LocalServer.csproj"
      service_name: "lpkg_localserver"
      # https:// to the location of deb release file we want.
      # deb_url: ""
      startup_parameters: "--urls \"http://localhost:5001;\""
      exec_start: "./LunaticPanel.Package.LocalServer"
      working_dir: "/srv/lunaticpanel_lpkg_localserver"
      description: "Lunatic Panel Local Package Server"
      environment:
        - "ASPNETCORE_ENVIRONMENT=Development"
      show: true
