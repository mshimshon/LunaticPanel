services:
  - import_from: "../../lpcli-compose.yml"  # will import all the services from Panel Source first

plugins:
   #- importFrom: "../../Panel/src/lpcli-compose.yml"  # will import all the plugins from Panel Source firs  
  - dotnet_project: "./LunaticPanel.PackageManager/LunaticPanel.PackageManager.csproj"
    enabled: true


post_processing:
  - file: "../../sources.dev.json"
    file_to: /etc/lunaticpanel/plugins/lunaticpanel_packagemanager/config/packagemanager/sources.json
  - command: "mkdir -p /var/lib/lunaticpanel/plugins/lunaticpanel_packagemanager/local_lpkgs"