name: Release
on: [push, workflow_dispatch] # Add this line so act has an entry point
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      id-token: write
      contents: read


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: get_version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          
      ###########################################################################
      # BUILD SOURCE ZIP
      ###########################################################################

      - name: Build source.zip
        run: |
          # 1. Create the artifacts directory in the system temp folder
          mkdir -p /tmp/artifacts/output
          
          # 2. Zip the repository directly into the temp artifacts folder
          zip -r /tmp/artifacts/output/source.${VERSION}.zip . -x ".git/*"

      ###########################################################################
      # PUBLISH ARTIFACTS
      ###########################################################################

      - name: Publish LunaticPanel.Hybrid.Web (linux, not self-contained)
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          dotnet publish $GITHUB_WORKSPACE/src/LunaticPanel.Hybrid/LunaticPanel.Hybrid.Web/LunaticPanel.Hybrid.Web.csproj \
            -c Release -r linux-x64 --self-contained false -o /tmp/artifacts/web /p:AssemblyVersion=$VERSION /p:FileVersion=$VERSION /p:InformationalVersion=$VERSION
          tar -czf /tmp/artifacts/output/lunaticpanel.${VERSION}.tar.gz -C /tmp/artifacts/web .

      - name: Publish LunaticPanel.Package.Tool (self-contained)
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          dotnet publish $GITHUB_WORKSPACE/tools/LunaticPanel.Package.Tool/LunaticPanel.Package.Tool.csproj \
            -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o /tmp/artifacts/tool /p:AssemblyVersion=$VERSION /p:FileVersion=$VERSION /p:InformationalVersion=$VERSION
          tar -czf /tmp/artifacts/output/lpkg_tool.${VERSION}.tar.gz -C /tmp/artifacts/tool .

      - name: Publish LunaticPanel.Package.LocalServer (linux, not self-contained)
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          dotnet publish $GITHUB_WORKSPACE/tools/LunaticPanel.Package.LocalServer/LunaticPanel.Package.LocalServer.csproj \
            -c Release -r linux-x64 --self-contained false -o /tmp/artifacts/server-lite /p:AssemblyVersion=$VERSION /p:FileVersion=$VERSION /p:InformationalVersion=$VERSION
          tar -czf /tmp/artifacts/output/lpkg-server-lite.${VERSION}.tar.gz -C /tmp/artifacts/server-lite .


      ###########################################################################
      # PACK NUGET PACKAGES IN ORDER
      ###########################################################################

      - name: Pack NuGet packages
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          mkdir -p "/tmp/artifacts/output"
          KEY_PROJECTS=(
            "src/LunaticPanel.Core.Analyzer/LunaticPanel.Core.Analyzer.csproj"
            "src/LunaticPanel.Core.Abstraction/LunaticPanel.Core.Abstraction.csproj"
            "src/LunaticPanel.Core.PluginValidator/LunaticPanel.Core.PluginValidator.csproj"
            "src/LunaticPanel.Core/LunaticPanel.Core.csproj"
            "src/LunaticPanel.Core.Extensions/LunaticPanel.Core.Extensions.csproj"
            "src/LunaticPanel.Core.Utils.Abstraction/LunaticPanel.Core.Utils.Abstraction.csproj"
            "src/LunaticPanel.Core.Utils/LunaticPanel.Core.Utils.csproj"
            "tools/LunaticPanel.Package.Server/LunaticPanel.Package.Server.csproj"
            "plugins/PackageManager/LunaticPanel.PackageManager.Keys/LunaticPanel.PackageManager.Keys.csproj"
            "src/LunaticPanel.Engine.Keys/LunaticPanel.Engine.Keys.csproj"
            # add more Keys projects here
          )

          for KEY in "${KEY_PROJECTS[@]}"; do
            ABSOLUTE_CSPROJ_PATH="${{ github.workspace }}/$KEY"
            dotnet pack "$ABSOLUTE_CSPROJ_PATH" -c Release -o "/tmp/artifacts/output" /p:Version=$VERSION
          done

      ###########################################################################
      # PACKAGE PLUGINS USING TOOL
      ###########################################################################
      - name: Package plugins
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          PLUGINS=(
            "$GITHUB_WORKSPACE/plugins/PackageManager/LunaticPanel.PackageManager/LunaticPanel.PackageManager.csproj"
          )
          

          for KEY in "${PLUGINS[@]}"; do
            FILE_NAME=$(basename "$KEY")
            FILE_NAME=$(basename "$KEY")
            PROJECT_NAME="${FILE_NAME%.csproj}"
            TARGET_BUILD_DIR="/tmp/artifacts/plugins_build/$PROJECT_NAME"
            mkdir -p "$TARGET_BUILD_DIR"
            dotnet build "$KEY" -c Release -o "$TARGET_BUILD_DIR" /p:FileVersion=$VERSION /p:InformationalVersion=$VERSION /p:Version=$VERSION /p:AssemblyVersion=$VERSION
            /tmp/artifacts/tool/LunaticPanel.Package.Tool pack --input "$TARGET_BUILD_DIR" --output " /tmp/artifacts/output" --version $VERSION
          done

          ls /tmp/artifacts/output/*.*

  deploy_nuget:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Crucial for OIDC token request privileges
      contents: read

    strategy:
      max-parallel: 1 # Guarantees execution down the array line in exact top-to-bottom sequence
      fail-fast: true # <--- ADD THIS LINE to kill the rest on failure
      matrix:
        package: 
           - "src/LunaticPanel.Core.Analyzer/LunaticPanel.Core.Analyzer.csproj"
           - "src/LunaticPanel.Core.Abstraction/LunaticPanel.Core.Abstraction.csproj"
           - "src/LunaticPanel.Core.PluginValidator/LunaticPanel.Core.PluginValidator.csproj"
           - "src/LunaticPanel.Core/LunaticPanel.Core.csproj"
           - "src/LunaticPanel.Core.Extensions/LunaticPanel.Core.Extensions.csproj"
           - "src/LunaticPanel.Core.Utils.Abstraction/LunaticPanel.Core.Utils.Abstraction.csproj"
           - "src/LunaticPanel.Core.Utils/LunaticPanel.Core.Utils.csproj"
           - "tools/LunaticPanel.Package.Server/LunaticPanel.Package.Server.csproj"
           - "plugins/PackageManager/LunaticPanel.PackageManager.Keys/LunaticPanel.PackageManager.Keys.csproj"
           - "src/LunaticPanel.Engine.Keys/LunaticPanel.Engine.Keys.csproj"
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Extract version
        id: get_version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Resolve Project Metadata
        id: metadata
        run: |
          RELATIVE_PATH="${{ matrix.package }}"
          FILENAME="${RELATIVE_PATH##*/}"
          PACKAGE_ID="${FILENAME%.csproj}"
          PACKAGE_ID_LOWER=$(echo "$PACKAGE_ID" | tr '[:upper:]' '[:lower:]')
          ABSOLUTE_CSPROJ_PATH="${{ github.workspace }}/${{ matrix.package }}"
          
          echo "Using Package ID: $PACKAGE_ID"
          echo "Absolute target: $ABSOLUTE_CSPROJ_PATH"
          
          echo "package_id=$PACKAGE_ID" >> $GITHUB_OUTPUT
          echo "package_id_lower=$PACKAGE_ID_LOWER" >> $GITHUB_OUTPUT
          echo "absolute_csproj_path=$ABSOLUTE_CSPROJ_PATH" >> $GITHUB_OUTPUT
      
          # Packs using the absolute path mapped directly from the workspace root
      - name: Pack NuGet Package
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "Absolute target: ${{ steps.metadata.outputs.absolute_csproj_path }}"
          mkdir -p "/tmp/artifacts/output"
          dotnet pack "${{ steps.metadata.outputs.absolute_csproj_path }}" -c Release -o "/tmp/artifacts/output" /p:Version="$VERSION"