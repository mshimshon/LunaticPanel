name: Branch WIP Cleanup

on:
  push:
    branches-ignore:
      - main


jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_TEST_RUNNER: Microsoft.Testing.Platform
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      id-token: write
      actions: write
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 👈 This forces GitHub to pull ALL history and tags

      - name: Check Git Checkout
        id: check_history
        run: |
          set -eu
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "::error::This directory is not a Git repository. Did you forget actions/checkout?"
            exit 1
          fi
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run squasher
        id: squasher
        shell: pwsh
        run: ./.github/scripts/wip_squasher.ps1


      - name: Squasher Result
        if: steps.squasher.outputs.squashed_ready == 'true'
        run: |
          echo "ready=${{ steps.squasher.outputs.squashed_ready }}"
          echo "from=${{ steps.squasher.outputs.squash_from }}"
          cat /tmp/commit.txt

      - name: Rewrite history 
        if: steps.squasher.outputs.squashed_ready == 'true'
        run: |
          SHA="${{ steps.squasher.outputs.squash_from }}"
    
          # Check if the commit has a parent
          if git rev-parse --verify "${SHA}^" >/dev/null 2>&1; then
            # Has a parent: safe to reset normally
            git reset --soft "${SHA}^"
          else
            # It's the root commit: soft reset back to an empty repo state
            git update-ref -d HEAD
          fi
    
          # Re-commit all staged changes with your new file
          git commit --allow-empty -F /tmp/commit.txt

      - name: Push rewritten branch
        if: steps.squasher.outputs.squashed_ready == 'true'
        run: |
          git push --force-with-lease origin HEAD