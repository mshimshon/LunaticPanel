name: Release

on:
  workflow_run:
    workflows: ["Build"] # 👈 Put the EXACT name of your build workflow here
    types:
      - completed
  workflow_dispatch: # Keeps your manual trigger working

concurrency:
  group: deploy-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      id-token: write
      contents: write

    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: build-assets
          path: /tmp/artifacts/output # where ever you saved the output.
          run-id: ${{ !env.ACT && github.event.workflow_run.id || '' }} # Empty if running ACT
          github-token: ${{ !env.ACT && secrets.GITHUB_TOKEN || '' }} # Empty if running ACT

      # Load the export variables
      - name: Load Variables into Outputs
        id: version_control
        shell: bash
        run: |
          ls -laR /tmp/artifacts || exit 1
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' /tmp/artifacts/output/build.env | tr -d '\r' >> "$GITHUB_OUTPUT"


      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version_control.outputs.trigger_branch }}
          fetch-depth: 0

      - name: Preparing CDN Files
        run: |
          mkdir -p /tmp/artifacts/cdn
          cp /tmp/artifacts/output/lunaticpanel_${{ steps.version_control.outputs.version_next }}.tar.gz /tmp/artifacts/cdn
          cp /tmp/artifacts/output/lunapackage_server_${{ steps.version_control.outputs.version_next }}.tar.gz /tmp/artifacts/cdn
          cp /tmp/artifacts/output/lunaticpanel_plugins_${{ steps.version_control.outputs.version_next }}.tar.gz /tmp/artifacts/cdn
          if [ -f /tmp/artifacts/output/stable.txt ]; then
              cp /tmp/artifacts/output/stable.txt /tmp/artifacts/cdn/
          fi

          if [ -f /tmp/artifacts/output/preview.txt ]; then
              cp /tmp/artifacts/output/preview.txt /tmp/artifacts/cdn/
          fi

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Create Release Tag
        if: ${{ !env.ACT }}
        run: |
          SHA=$(git rev-parse HEAD) || exit 1
          echo "Pushing ${{ steps.version_control.outputs.trigger_branch }} v${{ steps.version_control.outputs.version_next }} $SHA"
          git tag "v${{ steps.version_control.outputs.version_next }}" "$SHA"
          git push origin "v${{ steps.version_control.outputs.version_next }}" || exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_control.outputs.version_next }}
          fail_on_unmatched_files: true
          body_path: "/tmp/artifacts/output/changelog.md"
          prerelease: ${{ contains(steps.version_control.outputs.version_next, '-') }}
          files: |
            /tmp/artifacts/output/*.tar.gz

      - name: Upload to Cloudflare R2
        if: ${{ !env.ACT }}
        uses: ryand56/r2-upload-action@v1
        with:
          r2-account-id: ${{ secrets.CF_R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.CF_R2_ACCESS_ID }}
          r2-secret-access-key: ${{ secrets.CF_R2_SECRET_KEY }}
          r2-bucket: 'lunaticpanel'
          source-dir: '/tmp/artifacts/cdn' # The folder you want to upload
          destination-dir: 'release'

      - name: Push all NuGet packages with retry
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 30
          max_attempts: 10
          retry_wait_seconds: 10
          command: |
            set -eu
            VERSION="${{ steps.version_control.outputs.version_next }}"

            for PKG in /tmp/artifacts/output/*.nupkg; do
              echo "Pushing $PKG"

              dotnet nuget push \
                "$PKG" \
                --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
                --source https://api.nuget.org/v3/index.json \
                --skip-duplicate || exit 1
            done


