name: Release

on:
  workflow_run:
    workflows: ["Build"] # 👈 Put the EXACT name of your build workflow here
    types:
      - completed
  workflow_dispatch: # Keeps your manual trigger working

concurrency:
  group: deploy-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      id-token: write
      actions: write
      contents: write

    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 👈 This forces GitHub to pull ALL history and tags 
      - name: Calculate Version
        id: get_version
        run: |
          set -eu
          # 1. Instantly fail if not inside a valid Git repository clone
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "::error::This directory is not a Git repository. Did you forget actions/checkout?"
            exit 1
          fi
          HEAD_COMMIT=$(git log -1 --pretty=format:%s)
          if echo "$HEAD_COMMIT" | grep -Eiq '\btrace[[:space:]]*:'; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -n 1) 
          echo "$LAST_TAG"
          if [ -z "$LAST_TAG" ]; then
            echo "First Release Detected"
            echo "version=0.0.100" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:%s) 
          PREV_VERSION=${LAST_TAG#v} 
          VERSION=$PREV_VERSION
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2) 
          PATCH=$(echo "$VERSION" | cut -d. -f3) 
          if echo "$COMMITS" | grep -iq '^trace:'; then
            echo "release=fasle" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$COMMITS" | grep -iq '^break:'; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0

          elif echo "$COMMITS" | grep -iq '^feat:'; then
            MINOR=$((MINOR + 1))
            PATCH=0

          elif echo "$COMMITS" | grep -iq '^fix:'; then
            PATCH=$((PATCH + 1))

          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Error this is not a release... there are no fix:,break: or feat:. commits!"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Current Release $VERSION"
          echo "Next Release $NEW_VERSION"

          echo "previous_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        if: steps.get_version.outputs.release == 'true'
        id: generate_release_notes
        run: |
          set -eu
          LAST_VERSION="${{ steps.get_version.outputs.previous_version }}"
          NEXT_VERSION="${{ steps.get_version.outputs.version }}"
          COMMITS=$(git log "v$LAST_VERSION"..HEAD --pretty=format:%s) 

          
          mkdir -p /tmp/artifacts/output
          RELEASE_NOTES_FILE="/tmp/artifacts/output/release_notes.md"
          echo "" > "$RELEASE_NOTES_FILE"

          # 1. Extract Breaking Changes from FULL commit bodies (%B)
          BREAKS=$(git log "v$LAST_VERSION"..HEAD --pretty=format:%B | grep -Ei '^break:' | sed 's/^[Bb][Rr][Ee][Aa][Kk]:[[:space:]]*//' | sed 's/^/- /' || true)
          if [ -n "$BREAKS" ]; then
            echo "## BREAKING CHANGES" >> "$RELEASE_NOTES_FILE"
            printf "%s\n" "$BREAKS" >> "$RELEASE_NOTES_FILE"
            echo "" >> "$RELEASE_NOTES_FILE"
          fi

          # 2. Extract Features from FULL commit bodies (%B)
          FEATS=$(git log "v$LAST_VERSION"..HEAD --pretty=format:%B | grep -Ei '^feat:' | sed 's/^[Ff][Ee][Aa][Tt]:[[:space:]]*//' | sed 's/^/- /' || true)
          if [ -n "$FEATS" ]; then
            echo "## New Features" >> "$RELEASE_NOTES_FILE"
            printf "%s\n" "$FEATS" >> "$RELEASE_NOTES_FILE"
            echo "" >> "$RELEASE_NOTES_FILE"
          fi

          # 3. Extract Fixes from FULL commit bodies (%B)
          FIXES=$(git log "v$LAST_VERSION"..HEAD --pretty=format:%B | grep -Ei '^fix:' | sed 's/^[Ff][Ii][Xx]:[[:space:]]*//' | sed 's/^/- /' || true)
          if [ -n "$FIXES" ]; then
            echo "## Fixes" >> "$RELEASE_NOTES_FILE"
            printf "%s\n" "$FIXES" >> "$RELEASE_NOTES_FILE"
            echo "" >> "$RELEASE_NOTES_FILE"
          fi

          # 4. Extract Notes from FULL commit bodies (%B)
          NOTES=$(git log "v$LAST_VERSION"..HEAD --pretty=format:%B | grep -Ei '^note:' | sed 's/^[Nn][Oo][Tt][Ee]:[[:space:]]*//' | sed 's/^/- /' || true)
          if [ -n "$NOTES" ]; then
            echo "## Notes" >> "$RELEASE_NOTES_FILE"
            printf "%s\n" "$NOTES" >> "$RELEASE_NOTES_FILE"
            echo "" >> "$RELEASE_NOTES_FILE"
          fi


          echo "notes_file=$RELEASE_NOTES_FILE" >> "$GITHUB_OUTPUT"


      - name: Setup .NET 10
        if: steps.get_version.outputs.release == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      ########################################################################### 
      # PUBLISH ARTIFACTS
      ###########################################################################

      - name: Publish LunaticPanel.Hybrid.Web (linux, not self-contained)
        if: steps.get_version.outputs.release == 'true'
        run: |
          set -eu
          VERSION="${{ steps.get_version.outputs.version }}"

          dotnet publish \
            $GITHUB_WORKSPACE/src/LunaticPanel.Hybrid/LunaticPanel.Hybrid.Web/LunaticPanel.Hybrid.Web.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -o /tmp/artifacts/web \
            /p:AssemblyVersion=$VERSION \
            /p:FileVersion=$VERSION \
            /p:InformationalVersion=$VERSION

          tar -czf "/tmp/artifacts/output/lunaticpanel.${VERSION}.tar.gz" \
            -C /tmp/artifacts/web .

      - name: Publish LunaticPanel.Package.Tool (self-contained)
        if: steps.get_version.outputs.release == 'true'
        run: |
          set -eu
          VERSION="${{ steps.get_version.outputs.version }}"

          dotnet publish \
            $GITHUB_WORKSPACE/tools/LunaticPanel.Package.Tool/LunaticPanel.Package.Tool.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o /tmp/artifacts/tool \
            /p:AssemblyVersion=$VERSION \
            /p:FileVersion=$VERSION \
            /p:InformationalVersion=$VERSION

          tar -czf "/tmp/artifacts/output/lpkg_tool.${VERSION}.tar.gz" \
            -C /tmp/artifacts/tool .

      - name: Publish LunaticPanel.Package.LocalServer (linux, not self-contained)
        if: steps.get_version.outputs.release == 'true'
        run: |
          set -eu
          VERSION="${{ steps.get_version.outputs.version }}"

          dotnet publish \
            $GITHUB_WORKSPACE/tools/LunaticPanel.Package.LocalServer/LunaticPanel.Package.LocalServer.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -o /tmp/artifacts/server-lite \
            /p:AssemblyVersion=$VERSION \
            /p:FileVersion=$VERSION \
            /p:InformationalVersion=$VERSION

          tar -czf "/tmp/artifacts/output/lpkg-server-lite.${VERSION}.tar.gz" \
            -C /tmp/artifacts/server-lite .

      ###########################################################################
      # PACK NUGET PACKAGES IN ORDER
      ###########################################################################

      - name: Pack NuGet packages
        if: steps.get_version.outputs.release == 'true'
        run: |
          set -eu
          VERSION="${{ steps.get_version.outputs.version }}"

          KEY_PROJECTS=(
            "src/LunaticPanel.Core.Analyzer/LunaticPanel.Core.Analyzer.csproj"
            "src/LunaticPanel.Core.Abstraction/LunaticPanel.Core.Abstraction.csproj"
            "src/LunaticPanel.Core.PluginValidator/LunaticPanel.Core.PluginValidator.csproj"
            "src/LunaticPanel.Core/LunaticPanel.Core.csproj"
            "src/LunaticPanel.Core.Extensions/LunaticPanel.Core.Extensions.csproj"
            "src/LunaticPanel.Core.Utils.Abstraction/LunaticPanel.Core.Utils.Abstraction.csproj"
            "src/LunaticPanel.Core.Utils/LunaticPanel.Core.Utils.csproj"
            "tools/LunaticPanel.Package.Tool/LunaticPanel.Package.Tool.csproj"
            "tools/LunaticPanel.DebugTool/LunaticPanel.DebugTool.csproj"
            "tools/LunaticPanel.Package.Server/LunaticPanel.Package.Server.csproj"
            "plugins/PackageManager/LunaticPanel.PackageManager.Keys/LunaticPanel.PackageManager.Keys.csproj"
            "src/LunaticPanel.Engine.Keys/LunaticPanel.Engine.Keys.csproj"
          )

          for KEY in "${KEY_PROJECTS[@]}"; do
            ABSOLUTE_CSPROJ_PATH="${{ github.workspace }}/$KEY"

            dotnet pack \
              "$ABSOLUTE_CSPROJ_PATH" \
              -c Release \
              -o "/tmp/artifacts/output" \
              /p:Version=$VERSION
          done

      ###########################################################################
      # PACKAGE PLUGINS USING TOOL
      ###########################################################################

      - name: Package plugins
        if: steps.get_version.outputs.release == 'true'
        run: |
          set -eu
          VERSION="${{ steps.get_version.outputs.version }}"

          PLUGINS=(
            "$GITHUB_WORKSPACE/plugins/PackageManager/LunaticPanel.PackageManager/LunaticPanel.PackageManager.csproj"
          )

          for KEY in "${PLUGINS[@]}"; do
            FILE_NAME=$(basename "$KEY")
            PROJECT_NAME="${FILE_NAME%.csproj}"

            TARGET_BUILD_DIR="/tmp/artifacts/plugins_build/$PROJECT_NAME"
            mkdir -p "$TARGET_BUILD_DIR"

            dotnet publish \
              "$KEY" \
              -r linux-x64 \
              -c Release \
              -o "$TARGET_BUILD_DIR" \
              /p:FileVersion=$VERSION \
              /p:InformationalVersion=$VERSION \
              /p:Version=$VERSION \
              /p:AssemblyVersion=$VERSION

            /tmp/artifacts/tool/LunaticPanel.Package.Tool \
              pack \
              --input "$TARGET_BUILD_DIR" \
              --output "/tmp/artifacts/output" \
              --version $VERSION

            EXPECTED_PKG="/tmp/artifacts/output/${PROJECT_NAME}.${VERSION}.lpkg"

            if [ -z "$EXPECTED_PKG" ] || [ ! -s "$EXPECTED_PKG" ]; then
              ls -R /tmp/artifacts/output
              echo "❌ Error: Packed file for ${PROJECT_NAME} version ${VERSION} was not generated or is empty!"
              exit 1
            else
              echo "✅ Verified: $(basename "$EXPECTED_PKG") exists and is valid."
            fi
          done

          ls -R /tmp/artifacts/output
      - name: Push Version Tag
        if: steps.get_version.outputs.release == 'true'
        run: |
          set -eu
          TAG="v${{ steps.get_version.outputs.version }}"
          git tag "$TAG" || exit 1
          git push origin "$TAG" || exit 1

      - name: Create GitHub Release
        if: steps.get_version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          body_path: ${{ steps.generate_release_notes.outputs.notes_file }}
          files: |
            /tmp/artifacts/output/*.*

      - name: NuGet login (OIDC → temp API key)
        if: steps.get_version.outputs.release == 'true'
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push all NuGet packages with retry
        if: steps.get_version.outputs.release == 'true'
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 30
          max_attempts: 10
          retry_wait_seconds: 10
          command: |
            set -eu
            VERSION="${{ steps.get_version.outputs.version }}"

            for PKG in /tmp/artifacts/output/*.nupkg; do
              echo "Pushing $PKG"

              dotnet nuget push \
                "$PKG" \
                --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
                --source https://api.nuget.org/v3/index.json \
                --skip-duplicate || exit 1
            done


