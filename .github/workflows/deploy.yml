name: Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: deploy-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      id-token: write
      actions: write
      contents: write

    if: |
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 👈 This forces GitHub to pull ALL history and tags
      - name: Calculate Version
        id: get_version
        run: |
          set -eu
          # 1. Instantly fail if not inside a valid Git repository clone
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "::error::This directory is not a Git repository. Did you forget actions/checkout?"
            exit 1
          fi
          LAST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -n 1) 
          echo "$LAST_TAG"
          if [ -z "$LAST_TAG" ]; then
            echo "First Release Detected"
            echo "version=v0.0.100" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:%s) 

          VERSION=${LAST_TAG#v} 

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2) 
          PATCH=$(echo "$VERSION" | cut -d. -f3) 

          if echo "$COMMITS" | grep -q '^break:'; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0

          elif echo "$COMMITS" | grep -q '^feat:'; then
            MINOR=$((MINOR + 1))
            PATCH=0

          elif echo "$COMMITS" | grep -q '^fix:'; then
            PATCH=$((PATCH + 1))

          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Error this is not a release... there are no fix:,break: or feat:. commits!"
            exit 1
          fi

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"



      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      ###########################################################################
      # PUBLISH ARTIFACTS
      ###########################################################################

      - name: Publish LunaticPanel.Hybrid.Web (linux, not self-contained)
        run: |
          set -eu
          VERSION="${{ steps.get_version.outputs.version }}"

          dotnet publish \
            $GITHUB_WORKSPACE/src/LunaticPanel.Hybrid/LunaticPanel.Hybrid.Web/LunaticPanel.Hybrid.Web.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -o /tmp/artifacts/web \
            /p:AssemblyVersion=$VERSION \
            /p:FileVersion=$VERSION \
            /p:InformationalVersion=$VERSION

          tar -czf "/tmp/artifacts/output/lunaticpanel.${VERSION}.tar.gz" \
            -C /tmp/artifacts/web .

      - name: Publish LunaticPanel.Package.Tool (self-contained)
        run: |
          set -eu
          VERSION="${{ steps.get_version.outputs.version }}"

          dotnet publish \
            $GITHUB_WORKSPACE/tools/LunaticPanel.Package.Tool/LunaticPanel.Package.Tool.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o /tmp/artifacts/tool \
            /p:AssemblyVersion=$VERSION \
            /p:FileVersion=$VERSION \
            /p:InformationalVersion=$VERSION

          tar -czf "/tmp/artifacts/output/lpkg_tool.${VERSION}.tar.gz" \
            -C /tmp/artifacts/tool .

      - name: Publish LunaticPanel.Package.LocalServer (linux, not self-contained)
        run: |
          set -eu
          VERSION="${{ steps.get_version.outputs.version }}"

          dotnet publish \
            $GITHUB_WORKSPACE/tools/LunaticPanel.Package.LocalServer/LunaticPanel.Package.LocalServer.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -o /tmp/artifacts/server-lite \
            /p:AssemblyVersion=$VERSION \
            /p:FileVersion=$VERSION \
            /p:InformationalVersion=$VERSION

          tar -czf "/tmp/artifacts/output/lpkg-server-lite.${VERSION}.tar.gz" \
            -C /tmp/artifacts/server-lite .

      ###########################################################################
      # PACK NUGET PACKAGES IN ORDER
      ###########################################################################

      - name: Pack NuGet packages
        run: |
          set -eu
          VERSION="${{ steps.get_version.outputs.version }}"

          KEY_PROJECTS=(
            "src/LunaticPanel.Core.Analyzer/LunaticPanel.Core.Analyzer.csproj"
            "src/LunaticPanel.Core.Abstraction/LunaticPanel.Core.Abstraction.csproj"
            "src/LunaticPanel.Core.PluginValidator/LunaticPanel.Core.PluginValidator.csproj"
            "src/LunaticPanel.Core/LunaticPanel.Core.csproj"
            "src/LunaticPanel.Core.Extensions/LunaticPanel.Core.Extensions.csproj"
            "src/LunaticPanel.Core.Utils.Abstraction/LunaticPanel.Core.Utils.Abstraction.csproj"
            "src/LunaticPanel.Core.Utils/LunaticPanel.Core.Utils.csproj"
            "tools/LunaticPanel.Package.Tool/LunaticPanel.Package.Tool.csproj"
            "tools/LunaticPanel.DebugTool/LunaticPanel.DebugTool.csproj"
            "tools/LunaticPanel.Package.Server/LunaticPanel.Package.Server.csproj"
            "plugins/PackageManager/LunaticPanel.PackageManager.Keys/LunaticPanel.PackageManager.Keys.csproj"
            "src/LunaticPanel.Engine.Keys/LunaticPanel.Engine.Keys.csproj"
          )

          for KEY in "${KEY_PROJECTS[@]}"; do
            ABSOLUTE_CSPROJ_PATH="${{ github.workspace }}/$KEY"

            dotnet pack \
              "$ABSOLUTE_CSPROJ_PATH" \
              -c Release \
              -o "/tmp/artifacts/output" \
              /p:Version=$VERSION
          done

      ###########################################################################
      # PACKAGE PLUGINS USING TOOL
      ###########################################################################

      - name: Package plugins
        run: |
          set -eu
          VERSION="${{ steps.get_version.outputs.version }}"

          PLUGINS=(
            "$GITHUB_WORKSPACE/plugins/PackageManager/LunaticPanel.PackageManager/LunaticPanel.PackageManager.csproj"
          )

          for KEY in "${PLUGINS[@]}"; do
            FILE_NAME=$(basename "$KEY")
            PROJECT_NAME="${FILE_NAME%.csproj}"

            TARGET_BUILD_DIR="/tmp/artifacts/plugins_build/$PROJECT_NAME"
            mkdir -p "$TARGET_BUILD_DIR"

            dotnet publish \
              "$KEY" \
              -r linux-x64 \
              -c Release \
              -o "$TARGET_BUILD_DIR" \
              /p:FileVersion=$VERSION \
              /p:InformationalVersion=$VERSION \
              /p:Version=$VERSION \
              /p:AssemblyVersion=$VERSION

            /tmp/artifacts/tool/LunaticPanel.Package.Tool \
              pack \
              --input "$TARGET_BUILD_DIR" \
              --output "/tmp/artifacts/output" \
              --version $VERSION

            EXPECTED_PKG="/tmp/artifacts/output/${PROJECT_NAME}.${VERSION}.lpkg"

            if [ -z "$EXPECTED_PKG" ] || [ ! -s "$EXPECTED_PKG" ]; then
              ls -R /tmp/artifacts/output
              echo "❌ Error: Packed file for ${PROJECT_NAME} version ${VERSION} was not generated or is empty!"
              exit 1
            else
              echo "✅ Verified: $(basename "$EXPECTED_PKG") exists and is valid."
            fi
          done

          ls -R /tmp/artifacts/output
      - name: Push Version Tag
        run: |
          set -eu
          TAG="v${{ steps.get_version.outputs.version }}"
          git tag "$TAG" || exit 1
          git push origin "$TAG" || exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          files: |
            /tmp/artifacts/output/*.*

  deploy_nuget:
    needs: release
    runs-on: ubuntu-latest

    environment:
      name: production

    timeout-minutes: 360

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: get_version
        run: |
          set -eu
          mkdir -p "/tmp/artifacts/output"

          TAG="${{ github.event.workflow_run.head_branch }}"
          VERSION="${TAG#v}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Pack NuGet packages
        run: |
          set -eu
          VERSION="${{ steps.get_version.outputs.version }}"

          KEY_PROJECTS=(
            "src/LunaticPanel.Core.Analyzer/LunaticPanel.Core.Analyzer.csproj"
            "src/LunaticPanel.Core.Abstraction/LunaticPanel.Core.Abstraction.csproj"
            "src/LunaticPanel.Core.PluginValidator/LunaticPanel.Core.PluginValidator.csproj"
            "src/LunaticPanel.Core/LunaticPanel.Core.csproj"
            "src/LunaticPanel.Core.Extensions/LunaticPanel.Core.Extensions.csproj"
            "src/LunaticPanel.Core.Utils.Abstraction/LunaticPanel.Core.Utils.Abstraction.csproj"
            "src/LunaticPanel.Core.Utils/LunaticPanel.Core.Utils.csproj"
            "tools/LunaticPanel.Package.Tool/LunaticPanel.Package.Tool.csproj"
            "tools/LunaticPanel.DebugTool/LunaticPanel.DebugTool.csproj"
            "tools/LunaticPanel.Package.Server/LunaticPanel.Package.Server.csproj"
            "plugins/PackageManager/LunaticPanel.PackageManager.Keys/LunaticPanel.PackageManager.Keys.csproj"
            "src/LunaticPanel.Engine.Keys/LunaticPanel.Engine.Keys.csproj"
          )

          for KEY in "${KEY_PROJECTS[@]}"; do
            ABSOLUTE_CSPROJ_PATH="${{ github.workspace }}/$KEY"

            dotnet pack \
              "$ABSOLUTE_CSPROJ_PATH" \
              -c Release \
              -o "/tmp/artifacts/output" \
              /p:Version=$VERSION
          done

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push all NuGet packages with retry
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 30
          max_attempts: 10
          retry_wait_seconds: 10
          command: |
            set -eu
            VERSION="${{ steps.get_version.outputs.version }}"

            for PKG in /tmp/artifacts/output/*.nupkg; do
              echo "Pushing $PKG"

              dotnet nuget push \
                "$PKG" \
                --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
                --source https://api.nuget.org/v3/index.json \
                --skip-duplicate || exit 1
            done
